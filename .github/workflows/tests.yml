name: 検証

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 依存関係をインストール
        run: python -m pip install -r requirements.txt 'pytest>=8.0'
      - name: API・認証・ワークフローを検証
        run: python -m pytest -q
      - name: JavaScript構文・依存関係を検証
        run: |
          node --check static/app.js
          python -m pip check
      - name: パッケージ構成をビルド
        run: python -m pip wheel . --no-deps --wheel-dir /tmp/lucci-fugu-wheels
